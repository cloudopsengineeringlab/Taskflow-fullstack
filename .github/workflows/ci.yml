
name: CI - Tests, Security & Quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  # ====================================
  # 1. BACKEND TESTS
  # ====================================
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: xdebug

      - name: Get Composer cache directory
        id: composer-cache
        working-directory: backend
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Copy .env
        working-directory: backend
        run: cp .env.example .env

      - name: Generate application key
        working-directory: backend
        run: php artisan key:generate

      # - name: Run tests
      #   working-directory: backend
      #   run: php artisan test --coverage-clover=coverage.xml

      # - name: Upload coverage
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: backend-coverage
      #     path: backend/coverage.xml


  # ====================================
  # 2. FRONTEND TESTS
  # ====================================
  
  
  
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # - name: Run tests
      #   working-directory: frontend
      #   run: npm test -- --coverage --watchAll=false

      # Coverage upload removed because tests are currently disabled.


  # ====================================
  # 3. SONARQUBE
  # ====================================
  sonar:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Uncomment when coverage is generated
      # - name: Download coverage
      #   uses: actions/download-artifact@v4
      #   with:
      #     path: .

      - name: Run SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: build frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/react-frontend:${{ github.sha }}
          cache-from: type=gha,scope=taskflow-frontend
          cache-to: type=gha,mode=max,scope=taskflow-frontend

      - name: Push React frontend image
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/react-frontend:${{ github.sha }}
        run: docker push "$IMAGE"

      
      - name: build Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/laravel-api:${{ github.sha }}
          cache-from: type=gha,scope=taskflow-backend
          cache-to: type=gha,mode=max,scope=taskflow-backend

      - name: Push React frontend image
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/react-frontend:${{ github.sha }}
        run: docker push "$IMAGE"

      - name: Push Backend image
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/laravel-api:${{ github.sha }}
        run: docker push "$IMAGE"

   
  